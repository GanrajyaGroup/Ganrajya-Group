<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्वातंत्र्यदिन शुभेच्छा बॅनर मेकर | गणराज्य समूह</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <!-- QR Code JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            background: #ffffff;
        }
        #bannerCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.18);
            background-color: #ffffff;
        }
        .crop-container {
            max-height: 350px;
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
        }
        .social-btn {
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- नेव्हिगेशन बार -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">
                <i class="fa-solid fa-users-line me-2"></i>गणराज्य ग्रुप
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">मुख्यपृष्ठ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wishes.html">विशेष शुभेच्छा</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">संपर्क</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- मुख्य कंटेंट -->
    <div class="container py-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">
                <i class="fa-solid fa-flag text-danger me-2"></i>स्वातंत्र्यदिन शुभेच्छा बॅनर मेकर
            </h2>
            <p class="text-muted mb-0">तुमची माहिती भरून HD क्वालिटीमध्ये ऑफिशियल शुभेच्छा कार्ड डाऊनलोड करा!</p>
        </div>

        <div class="row g-4">
            <!-- इनपुट फॉर्म (डावी बाजू) -->
            <div class="col-lg-5">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-user-pen me-2"></i>वैयक्तिक माहिती</h5>

                    <div class="mb-3">
                        <label class="form-label fw-bold">१. तुमचे नाव:</label>
                        <input type="text" id="userName" class="form-control" placeholder="उदा. श्री. राहुल पाटील" value="श्री. राहुल पाटील" oninput="generateBanner()">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">२. सदस्य क्रमांक (Member ID):</label>
                        <input type="text" id="memberId" class="form-control" placeholder="उदा. GGS-0125" value="GGS-0125" oninput="generateBanner()">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">३. तुमचा फोटो निवडा:</label>
                        <input type="file" id="userPhotoInput" class="form-control" accept="image/*">
                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <button class="btn btn-success btn-lg fw-bold" onclick="downloadBanner()">
                            <i class="fa-solid fa-download me-2"></i>बॅनर डाऊनलोड करा
                        </button>
                        <button class="btn btn-primary fw-bold" onclick="shareBanner()">
                            <i class="fa-solid fa-share-nodes me-2"></i>थेट शेअर करा
                        </button>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <button class="btn btn-sm btn-outline-success social-btn w-48" onclick="shareToWhatsApp()"><i class="fa-brands fa-whatsapp me-1"></i> WhatsApp</button>
                        <button class="btn btn-sm btn-outline-info social-btn w-48" onclick="shareToTelegram()"><i class="fa-brands fa-telegram me-1"></i> Telegram</button>
                    </div>
                </div>
            </div>

            <!-- प्रिव्ह्यू कॅनव्हास (उजवी बाजू) -->
            <div class="col-lg-7 text-center">
                <div class="card card-custom p-3">
                    <h5 class="text-secondary fw-bold mb-3"><i class="fa-solid fa-eye me-2"></i>HD Live Banner Preview</h5>
                    <div class="d-flex justify-content-center align-items-center" style="background: #eef2f5; border-radius: 12px; padding: 15px;">
                        <canvas id="bannerCanvas" width="1080" height="1600"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- फोटो क्रॉपर मॉडेल -->
    <div class="modal fade" id="cropModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">फोटो गोल आकारात क्रॉप करा</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="crop-container">
                        <img id="imageToCrop" src="" style="max-width: 100%;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">रद्द करा</button>
                    <button type="button" class="btn btn-primary" onclick="cropAndApply()">क्रॉप करा व जोडा</button>
                </div>
            </div>
        </div>
    </div>

    <!-- QR कोडसाठी हिडन दिव्हाईस -->
    <div id="qrcode" style="display:none;"></div>

    <!-- JS स्क्रिप्ट्स -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        const canvas = document.getElementById('bannerCanvas');
        const ctx = canvas.getContext('2d');
        let cropper = null;
        let croppedImageObj = null;
        let qrImageObj = null;

        // पेज लोड होताच QR कोड जनरेट करणे
        window.addEventListener('load', function() {
            new QRCode(document.getElementById("qrcode"), {
                text: "https://ganrajyagroup.github.io/Ganrajya-Group/",
                width: 150,
                height: 150
            });
            setTimeout(loadQRCodeImage, 500);
        });

        function loadQRCodeImage() {
            const qrImgElement = document.querySelector("#qrcode img");
            if(qrImgElement && qrImgElement.src) {
                qrImageObj = new Image();
                qrImageObj.onload = generateBanner;
                qrImageObj.src = qrImgElement.src;
            } else {
                generateBanner();
            }
        }

        // फोटो अपलोड आणि Cropper.js चालू करणे
        document.getElementById('userPhotoInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('imageToCrop');
                    img.src = event.target.result;
                    
                    const cropModal = new bootstrap.Modal(document.getElementById('cropModal'));
                    cropModal.show();

                    document.getElementById('cropModal').addEventListener('shown.bs.modal', function () {
                        if (cropper) cropper.destroy();
                        cropper = new Cropper(img, {
                            aspectRatio: 1,
                            viewMode: 1,
                            autoCropArea: 0.8
                        });
                    }, { once: true });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        function cropAndApply() {
            if (cropper) {
                const canvasData = cropper.getCroppedCanvas({ width: 400, height: 400 });
                croppedImageObj = new Image();
                croppedImageObj.onload = generateBanner;
                croppedImageObj.src = canvasData.toDataURL();

                bootstrap.Modal.getInstance(document.getElementById('cropModal')).hide();
            }
        }

        // संपूर्ण Canvas आर्टवर्क जनरेट करणे
        function generateBanner() {
            const width = canvas.width;  // 1080px
            const height = canvas.height; // 1600px
            const name = document.getElementById('userName').value.trim() || "श्री. राहुल पाटील";
            const memberId = document.getElementById('memberId').value.trim() || "GGS-0125";

            ctx.clearRect(0, 0, width, height);

            // १. पार्श्वभूमी (सफेद बॅकग्राउंड व ट्रायकलर बॉर्डर)
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = "#128807";
            ctx.lineWidth = 12;
            ctx.strokeRect(15, 15, width - 30, height - 30);
            
            ctx.strokeStyle = "#FF6600";
            ctx.lineWidth = 4;
            ctx.strokeRect(24, 24, width - 48, height - 48);

            // २. वरची सुंदर कविता
            ctx.fillStyle = "#A81D1D";
            ctx.font = "bold 36px 'Segoe UI', Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("उत्सव तीन रंगांचा, आभाळी आज सजला,", width / 2, 90);
            ctx.fillText("नतमस्तक मी त्या सर्वांसाठी", width / 2, 140);
            ctx.fillText("ज्यांनी माझा भारत देश घडविला.", width / 2, 190);

            // ३. '15' आणि अशोक चक्र आर्टवर्क
            // '1' (भगवा)
            ctx.fillStyle = "#FF5500";
            ctx.font = "900 320px 'Arial Black', Impact, sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("1", width / 2 - 10, 520);

            // '5' (हिरवा)
            ctx.fillStyle = "#0B8800";
            ctx.textAlign = "left";
            ctx.fillText("5", width / 2 - 20, 520);

            // मधील अशोक चक्र
            const wheelX = width / 2;
            const wheelY = 410;
            const wheelRadius = 80;

            ctx.save();
            ctx.beginPath();
            ctx.arc(wheelX, wheelY, wheelRadius, 0, 2 * Math.PI);
            ctx.lineWidth = 8;
            ctx.strokeStyle = "#000080";
            ctx.stroke();

            for (let i = 0; i < 24; i++) {
                let angle = (i * 15) * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(wheelX, wheelY);
                ctx.lineTo(wheelX + wheelRadius * Math.cos(angle), wheelY + wheelRadius * Math.sin(angle));
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000080";
                ctx.stroke();
            }
            ctx.restore();

            // ४. मुख्य टेक्स्ट
            ctx.fillStyle = "#0B3C5D";
            ctx.font = "900 100px Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("स्वातंत्र्यदिन", width / 2, 660);

            ctx.fillStyle = "#0F172A";
            ctx.font = "bold 44px Arial, sans-serif";
            ctx.fillText("निमित्त सर्व भारतीय नागरीकांना", width / 2, 735);

            ctx.fillStyle = "#000080";
            ctx.font = "bold 50px Arial, sans-serif";
            ctx.fillText("मंगलमय शुभेच्छा", width / 2, 800);

            ctx.fillStyle = "#0B8800";
            ctx.font = "bold 38px Arial, sans-serif";
            ctx.fillText("शुभेच्छुक - सर्व मित्र परिवार", width / 2, 870);

            // ५. खालील युझर इन्फो कार्ड (White Card Frame with Golden Border)
            const cardX = 40;
            const cardY = 920;
            const cardWidth = width - 80;
            const cardHeight = 320;

            ctx.fillStyle = "#FFFFFF";
            ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 25);
            ctx.fill();
            ctx.strokeStyle = "#D97706"; // Golden-Orange Frame
            ctx.lineWidth = 3;
            ctx.stroke();

            // ५.१ वर्तुळाकार युझर फोटो (Profile)
            const photoX = cardX + 160;
            const photoY = cardY + 160;
            const photoRadius = 110;

            ctx.save();
            ctx.beginPath();
            ctx.arc(photoX, photoY, photoRadius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.clip();

            if (croppedImageObj) {
                ctx.drawImage(croppedImageObj, photoX - photoRadius, photoY - photoRadius, photoRadius * 2, photoRadius * 2);
            } else {
                ctx.fillStyle = "#E2E8F0";
                ctx.fillRect(photoX - photoRadius, photoY - photoRadius, photoRadius * 2, photoRadius * 2);
                ctx.fillStyle = "#64748B";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText("फोटो", photoX, photoY + 10);
            }
            ctx.restore();

            // फोटोची डबल बॉर्डर (Tricolor accent)
            ctx.beginPath();
            ctx.arc(photoX, photoY, photoRadius + 4, 0, Math.PI * 2, true);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#FF6600";
            ctx.stroke();

            // ५.२ नाव व सदस्य क्रमांक
            ctx.textAlign = "left";
            ctx.fillStyle = "#701A75"; // Dark Reddish Tone
            ctx.font = "bold 52px Arial, sans-serif";
            ctx.fillText(name, cardX + 310, cardY + 140);

            // अंडरलाईन (Divider)
            ctx.beginPath();
            ctx.moveTo(cardX + 310, cardY + 170);
            ctx.lineTo(cardX + 730, cardY + 170);
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#CBD5E1";
            ctx.stroke();

            ctx.fillStyle = "#0F172A";
            ctx.font = "bold 34px Arial, sans-serif";
            ctx.fillText("सदस्य क्रमांक : ", cardX + 310, cardY + 225);

            ctx.fillStyle = "#DC2626"; // Highlighted Red ID
            ctx.font = "bold 36px Arial, sans-serif";
            ctx.fillText(memberId, cardX + 530, cardY + 225);

            // ५.३ QR कोड आणि माहिती
            if (qrImageObj) {
                const qrX = cardX + cardWidth - 180;
                const qrY = cardY + 50;
                ctx.drawImage(qrImageObj, qrX, qrY, 130, 130);

                ctx.textAlign = "center";
                ctx.fillStyle = "#0B8800";
                ctx.font = "bold 22px Arial, sans-serif";
                ctx.fillText("Scan & Join", qrX + 65, qrY + 160);

                ctx.fillStyle = "#475569";
                ctx.font = "18px Arial, sans-serif";
                ctx.fillText("ganrajyagroup.github.io", qrX + 65, qrY + 185);
            }

            // ६. तळाशी ब्रँडिंग बार (Dark Green Footer)
            const footerY = height - 120;
            ctx.fillStyle = "#043927"; // Deep Green
            ctx.fillRect(0, footerY, width, 80);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 26px Arial, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("👥 गणराज्य स्वयंसहाय्यता समूह", 40, footerY + 48);

            ctx.font = "22px Arial, sans-serif";
            ctx.fillText("📞 93214 30535", 430, footerY + 48);
            ctx.fillText("✉️ ganrajyagroup1@gmail.com", 630, footerY + 48);

            // ७. सर्वात खालील टॅगलाईन पट्टी (Bottom Slogan)
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, height - 40, width, 40);

            ctx.fillStyle = "#DC2626";
            ctx.font = "bold 22px Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("★   राष्ट्र प्रथम   ★   समाज सेवा   ★   स्वावलंबन   ★", width / 2, height - 12);
        }

        // डाऊनलोड फंक्शनालिटी
        function downloadBanner() {
            const link = document.createElement('a');
            link.download = 'Ganrajya_Independence_Day_Wish.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // थेट शेअरिंग (Web Share API)
        async function shareBanner() {
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'Independence_Day_Wish.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'स्वातंत्र्यदिन शुभेच्छा बॅनर',
                            text: 'गणराज्य स्वयंसहाय्यता समूहाच्या वतीने स्वातंत्र्य दिनाच्या हार्दिक शुभेच्छा!'
                        });
                    } catch (err) {
                        console.log("Share canceled", err);
                    }
                } else {
                    alert("तुमच्या ब्राऊझरमध्ये नेटिव्ह शेअरिंग सपोर्ट नाही. कृपया डाऊनलोड बटण वापरा!");
                }
            });
        }

        function shareToWhatsApp() {
            const text = encodeURIComponent("गणराज्य स्वयंसहाय्यता समूहाचे स्वातंत्र्य दिन शुभेच्छा बॅनर बनवा: https://ganrajyagroup.github.io/Ganrajya-Group/");
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        function shareToTelegram() {
            const text = encodeURIComponent("गणराज्य स्वयंसहाय्यता समूह शुभेच्छा बॅनर");
            const url = encodeURIComponent("https://ganrajyagroup.github.io/Ganrajya-Group/");
            window.open(`https://telegram.me/share/url?url=${url}&text=${text}`, '_blank');
        }
    </script>
</body>
</html>
