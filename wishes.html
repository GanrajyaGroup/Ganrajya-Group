<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विशेष शुभेच्छा बॅनर मेकर | गणराज्य समूह</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            background: #ffffff;
        }
        #bannerCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background-color: #ffffff;
        }
        .crop-container {
            max-height: 350px;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
        }
        .social-btn {
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- नेव्हिगेशन बार -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">
                <i class="fa-solid fa-users-line me-2"></i>गणराज्य ग्रुप
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">मुख्यपृष्ठ</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">सदस्य नोंदणी</a></li>
                    <li class="nav-item"><a class="nav-link" href="loan.html">कर्ज अर्ज</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">लॉगिन</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wishes.html">विशेष शुभेच्छा</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">संपर्क</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- मुख्य कंटेंट -->
    <div class="container py-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">
                <i class="fa-solid fa-wand-magic-sparkles text-warning me-2"></i>डिजिटल शुभेच्छा बॅनर मेकर
            </h2>
            <p class="text-muted mb-0">गणराज्य स्वयंसहाय्यता समूहाचे अधिकृत शुभेच्छा कार्ड तयार करा!</p>
        </div>

        <div class="row g-4">
            <!-- इनपुट फॉर्म -->
            <div class="col-lg-5">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-sliders me-2"></i>बॅनर पर्याय</h5>

                    <div class="mb-3">
                        <label class="form-label fw-bold">१. उत्सव / सण निवडा:</label>
                        <select id="templateSelect" class="form-select fw-bold text-primary" onchange="generateBanner()">
                            <option value="aug15">🇮🇳 १५ ऑगस्ट - स्वातंत्र्य दिन</option>
                            <option value="jan26">🇮🇳 २६ जानेवारी - प्रजासत्ताक दिन</option>
                            <option value="ganesh">🌺 श्री गणेशोत्सव शुभेच्छा</option>
                            <option value="diwali">🪔 शुभ दीपावली</option>
                        </select>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-7">
                            <label class="form-label fw-bold">२. तुमचे नाव:</label>
                            <input type="text" id="userName" class="form-control" placeholder="उदा. श्री. राहुल पाटील" value="श्री. राहुल पाटील" oninput="generateBanner()">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold">सदस्य क्र.:</label>
                            <input type="text" id="memberId" class="form-control" placeholder="GGS-0125" value="GGS-0125" oninput="generateBanner()">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">३. फोटो निवडा:</label>
                        <input type="file" id="userPhotoInput" class="form-control" accept="image/*">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">४. बॅनर आकार (HD Export):</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="aspectRatio" id="sizeInsta" value="insta" checked onchange="updateCanvasSize()">
                            <label class="btn btn-outline-primary" for="sizeInsta"><i class="fa-brands fa-instagram me-1"></i> Portrait (1080x1350)</label>

                            <input type="radio" class="btn-check" name="aspectRatio" id="sizeSquare" value="square" onchange="updateCanvasSize()">
                            <label class="btn btn-outline-primary" for="sizeSquare"><i class="fa-solid fa-square me-1"></i> Square (1080x1080)</label>
                        </div>
                    </div>

                    <hr>

                    <div class="d-grid gap-2">
                        <button class="btn btn-success btn-lg fw-bold" onclick="downloadBanner()">
                            <i class="fa-solid fa-download me-2"></i>बॅनर डाऊनलोड करा
                        </button>
                        <button class="btn btn-primary fw-bold" onclick="shareBanner()">
                            <i class="fa-solid fa-share-nodes me-2"></i>थेट शेअर करा
                        </button>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <button class="btn btn-sm btn-outline-success social-btn w-48" onclick="shareToWhatsApp()"><i class="fa-brands fa-whatsapp me-1"></i> WhatsApp</button>
                        <button class="btn btn-sm btn-outline-info social-btn w-48" onclick="shareToTelegram()"><i class="fa-brands fa-telegram me-1"></i> Telegram</button>
                    </div>

                </div>
            </div>

            <!-- लाईव्ह Canvas प्रिव्ह्यू -->
            <div class="col-lg-7 text-center">
                <div class="card card-custom p-3">
                    <h5 class="text-secondary fw-bold mb-3"><i class="fa-solid fa-eye me-2"></i>HD Live Preview</h5>
                    <div class="d-flex justify-content-center align-items-center" style="min-height: 500px; background: #eef2f5; border-radius: 12px; padding: 10px;">
                        <canvas id="bannerCanvas" width="1080" height="1350"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- फोटो क्रॉपर मॉडेल -->
    <div class="modal fade" id="cropModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">फोटो क्रॉप करा</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="crop-container">
                        <img id="imageToCrop" src="" style="max-width: 100%;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">रद्द करा</button>
                    <button type="button" class="btn btn-primary" onclick="cropAndApply()">क्रॉप करा व जोडा</button>
                </div>
            </div>
        </div>
    </div>

    <div id="qrcode" style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        let canvas = document.getElementById('bannerCanvas');
        let ctx = canvas.getContext('2d');
        let cropper = null;
        let croppedImageObj = null;
        let qrImageObj = null;

        window.addEventListener('load', function() {
            new QRCode(document.getElementById("qrcode"), {
                text: "https://ganrajyagroup.github.io/Ganrajya-Group/",
                width: 120,
                height: 120
            });
            setTimeout(loadQRCodeImage, 500);
        });

        function loadQRCodeImage() {
            const qrImgElement = document.querySelector("#qrcode img");
            if(qrImgElement && qrImgElement.src) {
                qrImageObj = new Image();
                qrImageObj.onload = generateBanner;
                qrImageObj.src = qrImgElement.src;
            }
        }

        function updateCanvasSize() {
            const isSquare = document.getElementById('sizeSquare').checked;
            canvas.width = 1080;
            canvas.height = isSquare ? 1080 : 1350;
            generateBanner();
        }

        document.getElementById('userPhotoInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('imageToCrop');
                    img.src = event.target.result;
                    
                    const cropModal = new bootstrap.Modal(document.getElementById('cropModal'));
                    cropModal.show();

                    document.getElementById('cropModal').addEventListener('shown.bs.modal', function () {
                        if (cropper) cropper.destroy();
                        cropper = new Cropper(img, {
                            aspectRatio: 1,
                            viewMode: 1,
                            autoCropArea: 0.8
                        });
                    }, { once: true });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        function cropAndApply() {
            if (cropper) {
                const canvasData = cropper.getCroppedCanvas({ width: 400, height: 400 });
                croppedImageObj = new Image();
                croppedImageObj.onload = generateBanner;
                croppedImageObj.src = canvasData.toDataURL();

                bootstrap.Modal.getInstance(document.getElementById('cropModal')).hide();
            }
        }

        function generateBanner() {
            const width = canvas.width;
            const height = canvas.height;
            const name = document.getElementById('userName').value.trim() || "तुमचे नाव";
            const memberId = document.getElementById('memberId').value.trim() || "GGS-0000";
            const template = document.getElementById('templateSelect').value;

            ctx.clearRect(0, 0, width, height);

            // १. बॅकग्राउंड
            if (template === 'aug15' || template === 'jan26') {
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#FF9933');
                grad.addColorStop(0.35, '#FFFFFF');
                grad.addColorStop(0.7, '#128807');
                grad.addColorStop(1, '#0B4604');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // २. शीर्ष ब्रँडिंग (Top Left)
                ctx.fillStyle = "#000080";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("गणराज्य स्वयंसहाय्यता समूह", width/2, 60);

                // ३. शुभेच्छा संदेश
                ctx.fillStyle = "#800000";
                ctx.font = "bold 36px Arial";
                ctx.fillText("देश विविध रंगांचा, देश विविध ढंगांचा!", width/2, 130);

                ctx.fillStyle = "#000080";
                ctx.font = "bold 60px Arial";
                ctx.fillText(template === 'aug15' ? "भारतीय स्वातंत्र्य दिनाच्या" : "प्रजासत्ताक दिनाच्या", width/2, 210);

                ctx.fillStyle = "#D32F2F";
                ctx.font = "bold 68px Arial";
                ctx.fillText("हार्दिक शुभेच्छा!", width/2, 290);

            } else if (template === 'ganesh') {
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#E65100');
                grad.addColorStop(0.5, '#FFB300');
                grad.addColorStop(1, '#BF360C');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("गणराज्य स्वयंसहाय्यता समूह", width/2, 60);

                ctx.font = "bold 60px Arial";
                ctx.fillText("॥ श्री गणेशाय नमः ॥", width/2, 160);
                ctx.font = "bold 65px Arial";
                ctx.fillText("गणेशोत्सवाच्या हार्दिक शुभेच्छा!", width/2, 250);
            } else {
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#311B92');
                grad.addColorStop(0.5, '#B71C1C');
                grad.addColorStop(1, '#FF8F00');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("गणराज्य स्वयंसहाय्यता समूह", width/2, 60);

                ctx.fillStyle = "#FFD54F";
                ctx.font = "bold 65px Arial";
                ctx.fillText("🪔 शुभ दीपावली 🪔", width/2, 160);
                ctx.font = "bold 50px Arial";
                ctx.fillText("समृद्धी आणि आनंदाच्या शुभेच्छा!", width/2, 250);
            }

            // ४. सिंगल गोल फोटो फ्रेम
            const photoY = height === 1080 ? 540 : 640;
            const photoRadius = 190;

            ctx.save();
            ctx.beginPath();
            ctx.arc(width/2, photoY, photoRadius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.clip();

            if (croppedImageObj) {
                ctx.drawImage(croppedImageObj, width/2 - photoRadius, photoY - photoRadius, photoRadius * 2, photoRadius * 2);
            } else {
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(width/2 - photoRadius, photoY - photoRadius, photoRadius * 2, photoRadius * 2);
                ctx.fillStyle = "#666666";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("तुमचा फोटो", width/2, photoY);
            }
            ctx.restore();

            // फोटो बॉर्डर
            ctx.beginPath();
            ctx.arc(width/2, photoY, photoRadius, 0, Math.PI * 2, true);
            ctx.lineWidth = 10;
            ctx.strokeStyle = "#000080";
            ctx.stroke();

            // ५. शुभेच्छुक नाव पट्टी
            const nameY = photoY + photoRadius + 60;
            ctx.fillStyle = "#FFFFFF";
            ctx.roundRect(width/2 - 380, nameY, 760, 130, 25);
            ctx.fill();
            ctx.strokeStyle = "#000080";
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = "#111827";
            ctx.font = "bold 42px Arial";
            ctx.textAlign = "center";
            ctx.fillText("शुभच्छुक: " + name, width/2, nameY + 55);

            ctx.fillStyle = "#D32F2F";
            ctx.font = "bold 28px Arial";
            ctx.fillText("सदस्य क्र.: " + memberId, width/2, nameY + 100);

            // ६. फुटर (तळाशी संपर्क आणि QR Code)
            const footerY = height - 180;
            ctx.fillStyle = "#0F172A";
            ctx.fillRect(0, footerY, width, 180);

            ctx.fillStyle = "#FF9933";
            ctx.font = "bold 32px Arial";
            ctx.textAlign = "left";
            ctx.fillText("गणराज्य स्वयंसहाय्यता समूह", 60, footerY + 55);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "24px Arial";
            ctx.fillText("📞 संपर्क / WhatsApp: 9321430535", 60, footerY + 100);
            ctx.fillText("✉️ ganrajyagroup1@gmail.com | 📍 मुंबई", 60, footerY + 140);

            if (qrImageObj) {
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(width - 190, footerY + 15, 150, 150);
                ctx.drawImage(qrImageObj, width - 180, footerY + 25, 130, 130);
            }
        }

        function downloadBanner() {
            const link = document.createElement('a');
            link.download = 'Ganrajya_Group_Wish.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function shareBanner() {
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'Ganrajya_Wish.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'गणराज्य समूह शुभेच्छा बॅनर',
                            text: 'गणराज्य स्वयंसहाय्यता समूहाच्या वतीने हार्दिक शुभेच्छा!'
                        });
                    } catch (err) {
                        console.log("Share canceled", err);
                    }
                } else {
                    alert("बॅनर डाऊनलोड करून शेअर करा!");
                }
            });
        }

        function shareToWhatsApp() {
            const text = encodeURIComponent("गणराज्य स्वयंसहाय्यता समूहाच्या अधिकृत शुभेच्छा बॅनर लिंक: https://ganrajyagroup.github.io/Ganrajya-Group/");
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        function shareToTelegram() {
            const text = encodeURIComponent("गणराज्य स्वयंसहाय्यता समूह शुभेच्छा बॅनर");
            const url = encodeURIComponent("https://ganrajyagroup.github.io/Ganrajya-Group/");
            window.open(`https://telegram.me/share/url?url=${url}&text=${text}`, '_blank');
        }

        window.onload = generateBanner;
    </script>
</body>
</html>
