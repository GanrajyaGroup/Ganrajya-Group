<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सदस्य नोंदणी | गणराज्य समूह</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="fa-solid fa-users-line me-2"></i>गणराज्य ग्रुप</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">मुख्यपृष्ठ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">सदस्य नोंदणी</a></li>
                    <li class="nav-item"><a class="nav-link" href="loan.html">कर्ज अर्ज</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">लॉगिन</a></li>
                    <li class="nav-item"><a class="nav-link" href="wishes.html">विशेष शुभेच्छा</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="text-center mb-4 text-primary fw-bold">नवीन सदस्य नोंदणी अर्ज</h3>
                    <form onsubmit="alert('नोंदणी अर्ज सबमिट झाला!'); return false;">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">पूर्ण नाव *</label>
                                <input type="text" class="form-control" required placeholder="नाव आडनाव">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">मोबाईल नंबर *</label>
                                <input type="tel" class="form-control" required placeholder="10 अंकी नंबर">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ओळखपत्र (उदा. पॅन कार्ड/ड्रायव्हिंग लायसन्स)</label>
                                <input type="text" class="form-control" placeholder="ओळखपत्र क्रमांक">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">व्यवसाय</label>
                                <input type="text" class="form-control" placeholder="उदा. शेती/नोकरी">
                            </div>
                            <div class="col-12">
                                <label class="form-label">संपूर्ण पत्ता *</label>
                                <textarea class="form-control" rows="2" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">वारसदाराचे नाव (Nominee) *</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">नाते</label>
                                <input type="text" class="form-control" placeholder="उदा. पत्नी/मुलगा">
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-primary btn-lg w-100">अर्ज सबमिट करा</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
